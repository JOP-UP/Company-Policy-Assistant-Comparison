services:
  - type: web
    name: company-policy-assistant-comparison
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-6-luna
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
